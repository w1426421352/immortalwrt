name: Build ImmortalWrt 24.10 (Precise Graft)

permissions:
  contents: write

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build-npu-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "NPU Builder"
          git config --global user.email "bot@github.com"

      - name: Clone ImmortalWrt 24.10 Source
        run: |
          # 1. 克隆官方 24.10 分支到子目录 openwrt
          git clone -b openwrt-24.10 --single-branch https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: Port Device Support (Precise Mode)
        working-directory: ./openwrt
        run: |
          # 2. 添加 Bingo 源
          git remote add bingo https://github.com/bingoguo93/immortalwrt.git
          git fetch bingo openwrt-25.12 --depth=20

          echo "🔍 Diagnosing Bingo's file structure..."
          
          # 【调试关键】如果这次还失败，这个命令会告诉我们到底有什么文件
          # 列出 target/linux/airoha 下的所有文件供参考
          git ls-tree -r --name-only bingo/openwrt-25.12 | grep "target/linux/airoha" | head -n 20 || echo "Files not listed"

          # =========================================================
          # A. 提取 DTS 文件 (使用确定的文件名)
          # =========================================================
          # 文件名：an7581-evb-xg-040g.dts
          
          # 定义可能的路径列表 (以防他移动了位置)
          POSSIBLE_PATHS=(
            "target/linux/airoha/dts/an7581-evb-xg-040g.dts"
            "target/linux/airoha/files/dts/an7581-evb-xg-040g.dts"
            "target/linux/airoha/dts/xg-040g-md.dts"
          )
          
          FOUND_DTS=""
          for path in "${POSSIBLE_PATHS[@]}"; do
             if git cat-file -e "bingo/openwrt-25.12:$path" 2>/dev/null; then
                FOUND_DTS="$path"
                echo "✅ Found DTS at: $path"
                break
             fi
          done
          
          # 如果还没找到，尝试暴力搜索
          if [ -z "$FOUND_DTS" ]; then
             echo "⚠️ Exact match failed, searching..."
             FOUND_DTS=$(git ls-tree -r --name-only bingo/openwrt-25.12 | grep "an7581-evb-xg-040g.dts" | head -n 1)
          fi

          if [ -n "$FOUND_DTS" ]; then
             # 确保目录存在
             mkdir -p target/linux/airoha/dts
             # 提取内容
             git show "bingo/openwrt-25.12:$FOUND_DTS" > target/linux/airoha/dts/an7581-evb-xg-040g.dts
             echo "✅ DTS grafted successfully to target/linux/airoha/dts/an7581-evb-xg-040g.dts"
          else
             echo "❌ CRITICAL: DTS file not found in Bingo's repo!"
             exit 1
          fi

          # =========================================================
          # B. 注册机型 (Patch Makefile)
          # =========================================================
          # 既然我们已经有了 dts，我们需要告诉 OpenWrt 编译它
          # 直接追加定义到 Makefile，这是最稳的方法，不用管 Bingo 的 Makefile 长啥样
          
          MAKEFILE_PATH="target/linux/airoha/image/Makefile"
          
          echo "🛠️ Registering device in Makefile..."
          
          # 检查是否已经存在定义 (避免重复运行脚本时出错)
          if grep -q "xg-040g" "$MAKEFILE_PATH"; then
             echo "✅ Device already registered in Makefile."
          else
             # 追加定义
             # 注意：DEVICE_DTS 必须匹配上面的文件名 (无后缀)
             cat >> "$MAKEFILE_PATH" <<EOF
          
          define Device/airoha_an7581-evb-xg-040g
            DEVICE_VENDOR := Nokia Bell
            DEVICE_MODEL := XG-040G-MD
            DEVICE_DTS := an7581-evb-xg-040g
            DEVICE_PACKAGES := kmod-airoha-ppe kmod-airoha-en7581-phy
          endef
          TARGET_DEVICES += airoha_an7581-evb-xg-040g
          EOF
             echo "✅ Device definition appended to Makefile."
          fi

      - name: Update Feeds & Config
        working-directory: ./openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          # 生成配置
          # 务必选中刚才定义的机型
          cat > .config <<EOF
          CONFIG_TARGET_airoha=y
          CONFIG_TARGET_airoha_an7581=y
          CONFIG_TARGET_airoha_an7581_DEVICE_airoha_an7581-evb-xg-040g=y
          CONFIG_PACKAGE_kmod-airoha-ppe=y
          CONFIG_PACKAGE_kmod-airoha-en7581-phy=y
          CONFIG_PACKAGE_luci=y
          EOF
          
          make defconfig
          echo "✅ Config generated."

      - name: Push to Branch
        working-directory: ./openwrt
        run: |
          git add .
          git commit -m "Build: 24.10 + an7581-evb-xg-040g.dts" || echo "Nothing to commit"
          
          cd ..
          cd openwrt
          git remote add my_repo https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push -f my_repo HEAD:refs/heads/immortalwrt-24.10-npu-mod
