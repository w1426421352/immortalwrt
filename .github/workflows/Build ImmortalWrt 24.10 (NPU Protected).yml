name: Build ImmortalWrt 24.10 (Final Fix)

permissions:
  contents: write

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build-npu-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "NPU Builder"
          git config --global user.email "bot@github.com"

      - name: Clone ImmortalWrt 24.10 Source
        run: |
          # 克隆官方 24.10 (Kernel 6.6)
          git clone -b openwrt-24.10 --single-branch https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: Port Device Support (Confirmed Path)
        working-directory: ./openwrt
        run: |
          # 添加 Bingo 源
          git remote add bingo https://github.com/bingoguo93/immortalwrt.git
          git fetch bingo openwrt-25.12 --depth=20

          echo "🎯 Grafting confirmed file: an7581-xg-040g-md.dts"

          # =========================================================
          # 1. 提取 DTS (路径已由日志确认为 target/linux/airoha/dts/)
          # =========================================================
          
          # 确保目录存在
          mkdir -p target/linux/airoha/dts
          
          # 直接提取正确的文件
          if git show "bingo/openwrt-25.12:target/linux/airoha/dts/an7581-xg-040g-md.dts" > target/linux/airoha/dts/an7581-xg-040g-md.dts; then
             echo "✅ DTS extracted successfully."
          else
             echo "❌ Failed to extract DTS. Check network or remote branch."
             exit 1
          fi

          # =========================================================
          # 2. 注册机型 (Patch Makefile)
          # =========================================================
          # 注意：文件名是 an7581-xg-040g-md.dts，所以 DEVICE_DTS 也是 an7581-xg-040g-md
          
          MAKEFILE_PATH="target/linux/airoha/image/Makefile"
          
          # 如果 image/Makefile 不存在 (可能是早期结构)，尝试创建一个简单的
          if [ ! -f "$MAKEFILE_PATH" ]; then
             echo "⚠️ Makefile not found, checking alternative..."
             # 有些版本可能在 target/linux/airoha/image/an7581.mk
             if [ -f "target/linux/airoha/image/an7581.mk" ]; then
                MAKEFILE_PATH="target/linux/airoha/image/an7581.mk"
             fi
          fi
          
          echo "🛠️ Appending to $MAKEFILE_PATH..."
          
          cat >> "$MAKEFILE_PATH" <<EOF
          
          define Device/airoha_an7581-xg-040g-md
            DEVICE_VENDOR := Nokia Bell
            DEVICE_MODEL := XG-040G-MD
            DEVICE_DTS := an7581-xg-040g-md
            DEVICE_PACKAGES := kmod-airoha-ppe kmod-airoha-en7581-phy
          endef
          TARGET_DEVICES += airoha_an7581-xg-040g-md
          EOF
          
          echo "✅ Device registered."

      - name: Update Feeds & Config
        working-directory: ./openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          # 生成配置
          # 必须与上面的 define Device/ 名字一致
          cat > .config <<EOF
          CONFIG_TARGET_airoha=y
          CONFIG_TARGET_airoha_an7581=y
          CONFIG_TARGET_airoha_an7581_DEVICE_airoha_an7581-xg-040g-md=y
          CONFIG_PACKAGE_kmod-airoha-ppe=y
          CONFIG_PACKAGE_kmod-airoha-en7581-phy=y
          CONFIG_PACKAGE_luci=y
          EOF
          
          make defconfig
          echo "✅ Config generated."

      - name: Push to Branch
        working-directory: ./openwrt
        run: |
          git add .
          git commit -m "Build: 24.10 + an7581-xg-040g-md" || echo "Nothing to commit"
          
          cd ..
          cd openwrt
          git remote add my_repo https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push -f my_repo HEAD:refs/heads/immortalwrt-24.10-npu-mod
