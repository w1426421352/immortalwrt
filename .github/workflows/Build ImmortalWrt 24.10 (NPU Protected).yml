name: "Build ImmortalWrt 24.10 (Branch: xg040g)"

permissions:
  contents: write

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build-npu-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "NPU Builder"
          git config --global user.email "bot@github.com"

      - name: Clone ImmortalWrt 24.10 Source
        run: |
          # 克隆官方 24.10 (Kernel 6.6)
          git clone -b openwrt-24.10 --single-branch https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: Port Device Support (Confirmed Path)
        working-directory: ./openwrt
        run: |
          # 添加 Bingo 源
          git remote add bingo https://github.com/bingoguo93/immortalwrt.git
          git fetch bingo openwrt-25.12 --depth=20

          echo "🎯 Grafting confirmed file: an7581-xg-040g-md.dts"

          # =========================================================
          # 1. 提取 DTS
          # =========================================================
          mkdir -p target/linux/airoha/dts
          
          if git show "bingo/openwrt-25.12:target/linux/airoha/dts/an7581-xg-040g-md.dts" > target/linux/airoha/dts/an7581-xg-040g-md.dts; then
             echo "✅ DTS extracted successfully."
          else
             echo "❌ Failed to extract DTS."
             exit 1
          fi

          # =========================================================
          # 2. 注册机型 (强制写入 an7581.mk)
          # =========================================================
          # 【修改点】不再判断 Makefile，强制指定 an7581.mk
          # 这是 AN7581 系列机型的专用定义文件，写入这里最规范，也最不容易冲突
          TARGET_MK="target/linux/airoha/image/an7581.mk"
          
          if [ ! -f "$TARGET_MK" ]; then
             echo "❌ Error: $TARGET_MK not found! Upstream structure might have changed."
             # 只有当 an7581.mk 真的不存在时，才回退到 Makefile，作为最后的保底
             TARGET_MK="target/linux/airoha/image/Makefile"
             echo "⚠️ Fallback to $TARGET_MK"
          fi
          
          echo "🛠️ Appending definition to $TARGET_MK..."
          
          # 检查是否已经存在 (防止脚本重复运行导致重复写入)
          if grep -q "airoha_an7581-xg-040g-md" "$TARGET_MK"; then
             echo "⚠️ Definition already exists, skipping append."
          else
             cat >> "$TARGET_MK" <<EOF
          
          # Added by Auto-Graft Script
          define Device/airoha_an7581-xg-040g-md
            DEVICE_VENDOR := Nokia Bell
            DEVICE_MODEL := XG-040G-MD
            DEVICE_DTS := an7581-xg-040g-md
            DEVICE_PACKAGES := kmod-airoha-ppe kmod-airoha-en7581-phy
          endef
          TARGET_DEVICES += airoha_an7581-xg-040g-md
          EOF
             echo "✅ Device registered."
          fi

          # =========================================================
          # 3. 结果验证 (Self-Check)
          # =========================================================
          echo "🔍 Verifying content of $TARGET_MK (Last 15 lines):"
          tail -n 15 "$TARGET_MK"

      - name: Update Feeds & Config
        working-directory: ./openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          # 生成配置 (验证 menuconfig 是否能识别)
          cat > .config <<EOF
          CONFIG_TARGET_airoha=y
          CONFIG_TARGET_airoha_an7581=y
          CONFIG_TARGET_airoha_an7581_DEVICE_airoha_an7581-xg-040g-md=y
          CONFIG_PACKAGE_kmod-airoha-ppe=y
          CONFIG_PACKAGE_kmod-airoha-en7581-phy=y
          CONFIG_PACKAGE_luci=y
          EOF
          
          make defconfig
          echo "✅ Config generated."

      - name: Push to Branch
        working-directory: ./openwrt
        run: |
          git add .
          git commit -m "Build: 24.10 + an7581-xg-040g-md" || echo "Nothing to commit"
          
          cd ..
          cd openwrt
          git remote add my_repo https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          # 推送到 openwrt-24.10-xg040g 分支
          git push -f my_repo HEAD:refs/heads/openwrt-24.10-xg040g
